version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ['@playwright/*', 'playwright*']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'eslint-*']
    ignore:
      # Types must match the runtime major in .nvmrc; bump both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript < 6.1; bump together deliberately.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
